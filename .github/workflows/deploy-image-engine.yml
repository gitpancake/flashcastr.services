name: Deploy image-engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/image-engine/**"
      - "libs/**"
      - "package.json"
      - "tsconfig.base.json"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail

            current_node_major() {
              node -v 2>/dev/null | sed -nE 's/^v([0-9]+).*/\1/p'
            }

            NODE_MAJOR=$(current_node_major)
            if [ -z "$NODE_MAJOR" ] || [ "$NODE_MAJOR" -lt 22 ]; then
              if ! sudo -n true 2>/dev/null; then
                echo "ERROR: Node < 22 and passwordless sudo is unavailable; cannot upgrade non-interactively. Aborting." >&2
                exit 1
              fi
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -n -E bash -
              DEBIAN_FRONTEND=noninteractive sudo -n apt-get install -y nodejs
              pm2 update

              NODE_MAJOR=$(current_node_major)
              if [ -z "$NODE_MAJOR" ] || [ "$NODE_MAJOR" -lt 22 ]; then
                echo "ERROR: Node upgrade attempted but version is still < 22 ($(node -v 2>/dev/null || echo 'unknown'))." >&2
                exit 1
              fi
            fi

            echo "node: $(node -v)"
            echo "npm: $(npm -v)"

            cd /opt/image-engine-app
            git pull origin main
            npm ci

            cat > .env << ENVEOF
            RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
            PINATA_JWT=${{ secrets.PINATA_JWT }}
            PROXY_LIST=${{ secrets.PROXY_LIST }}
            CONSUMER_CONCURRENCY=${{ secrets.CONSUMER_CONCURRENCY }}
            LOKI_URL=${{ secrets.LOKI_URL }}
            METRICS_PORT=9090
            NODE_ENV=production
            LOG_LEVEL=info
            ENVEOF

            pm2 restart image-engine || pm2 start apps/image-engine/ecosystem.config.cjs
            pm2 save
