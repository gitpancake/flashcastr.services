services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flashcastr
      POSTGRES_USER: flashcastr
      POSTGRES_PASSWORD: flashcastr
    volumes:
      - postgres_data:/var/lib/postgresql/data

  flash-engine:
    build:
      context: .
      dockerfile: apps/flash-engine/Dockerfile
    depends_on:
      postgres:
        condition: service_started
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://flashcastr:flashcastr@postgres:5432/flashcastr

  image-engine:
    build:
      context: .
      dockerfile: apps/image-engine/Dockerfile
    depends_on:
      postgres:
        condition: service_started
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://flashcastr:flashcastr@postgres:5432/flashcastr

  neynar-engine:
    build:
      context: .
      dockerfile: apps/neynar-engine/Dockerfile
    depends_on:
      postgres:
        condition: service_started
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://flashcastr:flashcastr@postgres:5432/flashcastr

volumes:
  postgres_data:
